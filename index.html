<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI OCR Studio - GitHub Pages対応版 (PDF＆写真・古文書・手書き文字起こし)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
    code, pre, kbd { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col p-4 sm:p-8 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- ヘッダー -->
  <header class="max-w-6xl w-full mx-auto flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
        <span class="text-xl">✨</span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg lg:text-xl font-bold text-white">AI OCR Studio</h1>
          <span class="px-2 py-0.5 text-[10px] font-semibold text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
            GitHub Pages 完全対応
          </span>
        </div>
        <p class="text-xs text-slate-400">PDF・写真・手書き・古文書（くずし字）文字起こし Webアプリ</p>
      </div>
    </div>

    <!-- APIキー設定エリア -->
    <div class="flex flex-wrap items-center gap-2 bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs">
      <span class="text-slate-400 font-semibold pl-1">Gemini APIキー:</span>
      <input type="password" id="api-key-input" placeholder="AIzaSy... を入力" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-indigo-500 w-44 sm:w-52 font-mono">
      <button onclick="testAndSaveApiKey()" id="key-test-btn" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg transition">
        保存＆接続テスト
      </button>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-400 hover:underline text-[11px] px-1" title="無料キーを取得">無料キー取得 ↗</a>
    </div>
  </header>

  <!-- エラー・通知バナー -->
  <div id="notice-banner" class="max-w-6xl w-full mx-auto mt-4 hidden">
    <div id="notice-box" class="p-3.5 rounded-xl text-xs flex items-start gap-2.5 border">
      <span id="notice-icon" class="text-base shrink-0">⚠️</span>
      <div id="notice-content" class="flex-1 leading-relaxed"></div>
      <button onclick="hideNotice()" class="text-slate-400 hover:text-white text-sm">✕</button>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col gap-6 pt-6">

    <!-- ファイル選択＆ドラッグ＆ドロップ (初期表示) -->
    <div id="dropzone-section" class="w-full flex flex-col gap-6">
      <div id="dropzone" class="border-2 border-dashed border-slate-700 hover:border-indigo-400 bg-slate-900/50 hover:bg-slate-900/80 rounded-3xl p-8 sm:p-12 text-center cursor-pointer transition flex flex-col items-center justify-center">
        <input type="file" id="file-input" accept="image/*,application/pdf" class="hidden">
        <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mb-4 text-3xl">
          📄
        </div>
        <h2 class="text-lg sm:text-xl font-bold text-white mb-2">PDFまたは画像をドラッグ＆ドロップ</h2>
        <p class="text-xs sm:text-sm text-slate-400 max-w-md mb-6 leading-relaxed">
          クリックしてファイル選択、またはクリップボードから直接貼り付け（<kbd class="px-1.5 py-0.5 text-xs bg-slate-800 border border-slate-700 rounded text-slate-300">Ctrl+V</kbd>）できます。
        </p>
        <button type="button" onclick="document.getElementById('file-input').click()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-500/25 transition">
          ファイルを選択
        </button>
      </div>

      <!-- サンプル書類でテスト -->
      <div class="flex flex-col gap-2.5">
        <h3 class="text-xs sm:text-sm font-bold text-slate-300">サンプル書類ですぐに試す（1クリック文字起こし）:</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <button onclick="loadSample('kuzushiji')" class="p-3.5 rounded-2xl bg-slate-900/70 hover:bg-slate-800 border border-amber-500/30 text-left transition">
            <span class="text-[10px] font-bold text-amber-300 px-2 py-0.5 bg-amber-500/10 rounded">古文書・くずし字</span>
            <h4 class="text-xs font-bold text-white mt-1.5 mb-0.5">江戸時代 通行手形</h4>
            <p class="text-[11px] text-slate-400">くずし字・変体仮名を翻刻＋現代語訳</p>
          </button>
          <button onclick="loadSample('handwriting')" class="p-3.5 rounded-2xl bg-slate-900/70 hover:bg-slate-800 border border-sky-500/30 text-left transition">
            <span class="text-[10px] font-bold text-sky-300 px-2 py-0.5 bg-sky-500/10 rounded">手書きメモ</span>
            <h4 class="text-xs font-bold text-white mt-1.5 mb-0.5">手書き会議ノート</h4>
            <p class="text-[11px] text-slate-400">ノートの走り書き・ToDo・略字補正</p>
          </button>
          <button onclick="loadSample('receipt')" class="p-3.5 rounded-2xl bg-slate-900/70 hover:bg-slate-800 border border-indigo-500/30 text-left transition">
            <span class="text-[10px] font-bold text-indigo-300 px-2 py-0.5 bg-indigo-500/10 rounded">レシート・領収書</span>
            <h4 class="text-xs font-bold text-white mt-1.5 mb-0.5">コンビニ領収書</h4>
            <p class="text-[11px] text-slate-400">店名・品目リスト・税抜・合計額</p>
          </button>
          <button onclick="loadSample('table')" class="p-3.5 rounded-2xl bg-slate-900/70 hover:bg-slate-800 border border-emerald-500/30 text-left transition">
            <span class="text-[10px] font-bold text-emerald-300 px-2 py-0.5 bg-emerald-500/10 rounded">表・CSV</span>
            <h4 class="text-xs font-bold text-white mt-1.5 mb-0.5">スペック比較仕様書</h4>
            <p class="text-[11px] text-slate-400">表組みデータをMarkdown＆CSV化</p>
          </button>
        </div>
      </div>
    </div>

    <!-- ワークスペース (左右分割画面) -->
    <div id="workspace-section" class="hidden flex-col gap-6">

      <!-- モード選択ツールバー -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label class="text-xs font-bold text-slate-300">抽出モードを選択:</label>
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <span>AIモデル:</span>
            <select id="model-select" class="bg-slate-950 border border-slate-700 text-white rounded px-2.5 py-1 text-xs focus:outline-none focus:border-indigo-500">
              <option value="gemini-3.8-flash">gemini-3.8-flash (思考推論・最高精度OCR)</option>
              <option value="gemini-flash-lite-latest">gemini-flash-lite (最速・混雑なし / 1.5秒)</option>
              <option value="gemini-3.5-flash">gemini-3.5-flash (標準高速 / 2〜3秒)</option>
              <option value="auto">自動 (混雑回避・最適モデル自動選択)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2">
          <button onclick="setMode('standard')" id="btn-standard" class="mode-btn p-2 rounded-xl border border-indigo-500 bg-indigo-600/20 text-xs text-white font-semibold text-left">標準忠実再現</button>
          <button onclick="setMode('kuzushiji')" id="btn-kuzushiji" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">古文書・くずし字</button>
          <button onclick="setMode('handwriting')" id="btn-handwriting" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">手書きメモ</button>
          <button onclick="setMode('table')" id="btn-table" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">表・CSV抽出</button>
          <button onclick="setMode('key_value')" id="btn-key_value" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">JSON構造化</button>
          <button onclick="setMode('markdown')" id="btn-markdown" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">Markdown</button>
          <button onclick="setMode('ruby_furigana')" id="btn-ruby_furigana" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">縦書き・ルビ</button>
          <button onclick="setMode('translate')" id="btn-translate" class="mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left">文字起こし＋訳</button>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-800">
          <span class="text-xs text-slate-400">ショートカット: Ctrl + Enter で即座に実行</span>
          <button id="run-btn" onclick="executeDirectOcr()" class="px-7 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white shadow-lg shadow-indigo-500/25 transition">
            文字起こしを開始
          </button>
        </div>
      </div>

      <!-- 左右2分割プレビュー -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
        
        <!-- 左：元画像/PDFプレビュー -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col min-h-[480px]">
          <div class="p-3 border-b border-slate-800 text-xs flex justify-between items-center text-slate-400">
            <span id="doc-title" class="font-semibold text-slate-200 truncate max-w-xs">プレビュー</span>
            <div class="space-x-1">
              <button onclick="rotate(-90)" class="px-2 py-1 bg-slate-800 rounded hover:text-white" title="左90°回転">↺ 90°</button>
              <button onclick="rotate(90)" class="px-2 py-1 bg-slate-800 rounded hover:text-white" title="右90°回転">↻ 90°</button>
              <button onclick="resetDoc()" class="px-2 py-1 text-rose-400 hover:bg-rose-500/10 rounded ml-2">別のファイル</button>
            </div>
          </div>
          <div class="flex-1 bg-slate-950 p-4 flex items-center justify-center overflow-auto min-h-[420px]">
            <img id="preview-img" src="" alt="プレビュー" class="max-h-[500px] max-w-full object-contain transition-transform duration-200 block shadow-md rounded">
            <iframe id="preview-pdf" src="" class="w-full h-full min-h-[480px] rounded-lg hidden border border-slate-800 bg-white"></iframe>
          </div>
        </div>

        <!-- 右：抽出テキストエディタ -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col min-h-[480px]">
          <div class="p-3 border-b border-slate-800 text-xs flex justify-between items-center">
            <span class="font-semibold text-slate-300">抽出テキスト結果</span>
            <div class="space-x-2">
              <button onclick="copyText()" id="copy-btn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-semibold transition">
                コピー
              </button>
              <button onclick="downloadText()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-semibold transition">
                保存 (.txt)
              </button>
            </div>
          </div>
          <div class="flex-1 p-4 bg-slate-950 flex flex-col">
            <textarea id="result" class="w-full flex-1 bg-transparent text-slate-100 font-mono text-xs sm:text-sm leading-relaxed resize-none focus:outline-none" placeholder="文字起こし結果がここに表示されます..."></textarea>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script>
    let base64Data = '';
    let mimeType = 'image/jpeg';
    let currentMode = 'standard';
    let rotation = 0;
    let currentBlobUrl = null;

    // 初期化：保存されているAPIキーをロード
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('api-key-input').value = savedKey;
      }
    });

    function showNotice(type, title, msg) {
      const banner = document.getElementById('notice-banner');
      const box = document.getElementById('notice-box');
      const icon = document.getElementById('notice-icon');
      const content = document.getElementById('notice-content');

      banner.classList.remove('hidden');
      if (type === 'success') {
        box.className = 'p-3.5 rounded-xl text-xs flex items-start gap-2.5 border bg-emerald-950/60 border-emerald-500/40 text-emerald-200';
        icon.textContent = '✅';
      } else {
        box.className = 'p-3.5 rounded-xl text-xs flex items-start gap-2.5 border bg-rose-950/60 border-rose-500/40 text-rose-200';
        icon.textContent = '❌';
      }
      content.innerHTML = `<strong>${title}</strong>: ${msg}`;
    }

    function hideNotice() {
      document.getElementById('notice-banner').classList.add('hidden');
    }

    // APIキーの接続テストと保存
    async function testAndSaveApiKey() {
      const key = (document.getElementById('api-key-input').value || '').trim().replace(/["']/g, '');
      if (!key) {
        showNotice('error', 'APIキー未入力', 'Google AI Studio で取得したAPIキーを入力してください。');
        return;
      }

      const btn = document.getElementById('key-test-btn');
      btn.disabled = true;
      btn.textContent = '通信テスト中...';

      try {
        const testUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${key}`;
        const res = await fetch(testUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: 'ping' }] }] })
        });
        const data = await res.json();

        if (data.error) {
          throw new Error(data.error.message || `エラー (${data.error.code})`);
        }

        localStorage.setItem('gemini_api_key', key);
        showNotice('success', '接続成功', 'Gemini API との疎通確認が完了しました！APIキーをブラウザに保存しました。');
      } catch (err) {
        showNotice('error', 'APIキー接続エラー', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '保存＆接続テスト';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.className = 'mode-btn p-2 rounded-xl border border-slate-800 bg-slate-950 text-xs text-slate-300 font-semibold text-left';
      });
      document.getElementById('btn-' + mode).className = 'mode-btn p-2 rounded-xl border border-indigo-500 bg-indigo-600/20 text-xs text-white font-semibold text-left';
    }

    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });

    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-indigo-400'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('border-indigo-400'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-indigo-400');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    window.addEventListener('paste', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
      if (e.clipboardData && e.clipboardData.files.length > 0) {
        handleFile(e.clipboardData.files[0]);
      }
    });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        executeDirectOcr();
      }
    });

    // ファイル読み込み＆適正サイズ変換（通信失敗を防ぐ）
    function handleFile(file) {
      hideNotice();
      const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }
      currentBlobUrl = URL.createObjectURL(file);
      showWorkspace(currentBlobUrl, file.name, isPdf);

      if (isPdf) {
        mimeType = 'application/pdf';
        const reader = new FileReader();
        reader.onload = (e) => {
          const raw = e.target.result;
          base64Data = (raw.split(',')[1] || '').replace(/[\r\n\s]/g, '');
        };
        reader.readAsDataURL(file);
      } else {
        mimeType = 'image/jpeg';
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 1600;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            const optimized = canvas.toDataURL('image/jpeg', 0.88);
            base64Data = (optimized.split(',')[1] || '').replace(/[\r\n\s]/g, '');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function showWorkspace(url, name, isPdf = false) {
      document.getElementById('dropzone-section').classList.add('hidden');
      const ws = document.getElementById('workspace-section');
      ws.classList.remove('hidden');
      ws.classList.add('flex');

      document.getElementById('doc-title').textContent = name;
      rotation = 0;

      const imgEl = document.getElementById('preview-img');
      const pdfEl = document.getElementById('preview-pdf');

      if (isPdf) {
        imgEl.classList.add('hidden');
        pdfEl.classList.remove('hidden');
        pdfEl.src = url;
      } else {
        pdfEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = url;
        imgEl.style.transform = `rotate(0deg)`;
      }
    }

    function resetDoc() {
      document.getElementById('workspace-section').classList.add('hidden');
      document.getElementById('workspace-section').classList.remove('flex');
      document.getElementById('dropzone-section').classList.remove('hidden');
      document.getElementById('result').value = '';
      base64Data = '';
      const imgEl = document.getElementById('preview-img');
      const pdfEl = document.getElementById('preview-pdf');
      imgEl.src = '';
      pdfEl.src = '';
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
    }

    function rotate(deg) {
      rotation = (rotation + deg) % 360;
      const imgEl = document.getElementById('preview-img');
      imgEl.style.transform = `rotate(${rotation}deg)`;
    }

    // Google Gemini REST API 実行 (gemini-3.8-flash 対応)
    async function executeDirectOcr() {
      hideNotice();
      const apiKey = (document.getElementById('api-key-input').value || localStorage.getItem('gemini_api_key') || '').trim().replace(/["']/g, '');
      if (!apiKey) {
        showNotice('error', 'APIキー未設定', '右上の入力欄に Gemini APIキー を入力して「保存」してください。');
        document.getElementById('api-key-input').focus();
        return;
      }
      if (!base64Data) {
        showNotice('error', 'ファイル未選択', 'ファイルがまだ読み込まれていません。画像を選択してください。');
        return;
      }

      const runBtn = document.getElementById('run-btn');
      const resultArea = document.getElementById('result');
      const selectedModel = document.getElementById('model-select').value;
      runBtn.disabled = true;
      runBtn.textContent = '解析中...';

      if (selectedModel === 'gemini-3.8-flash') {
        resultArea.value = 'Gemini 3.8 Flash で思考推論中... (深層解析のため15〜25秒ほどお待ちください)';
      } else {
        resultArea.value = 'Gemini で高速解析中...';
      }

      let systemInstruction = "あなたは高精度のOCR解析AIです。画像やPDFの文字を漏れなく正確にテキスト化してください。";
      let userPrompt = "この文書または画像に書かれているすべての文字を漏れなく高精度にテキスト化してください。";

      if (currentMode === 'kuzushiji') {
        systemInstruction = "あなたは日本の古文書学・翻刻の専門家です。くずし字・変体仮名を精密に翻刻し、【翻刻】、【現代語訳】、【語注・時代背景解説】の3部構成で丁寧に出力してください。";
        userPrompt = "この古文書・くずし字を専門的に解読し、翻刻、現代語訳、語注を出力してください。";
      } else if (currentMode === 'handwriting') {
        systemInstruction = "手書き文字解析のスペシャリストとして、ノートやホワイトボードの乱筆・続け字・略字・ToDoリストを文脈から正しく補正してテキスト化してください。";
      } else if (currentMode === 'table') {
        systemInstruction = "画像内の表組みや明細データをMarkdown表形式 (| 列1 | 列2 | ...) に整形して出力してください。";
      } else if (currentMode === 'key_value') {
        systemInstruction = "主要項目を整理し、最後に ```json ... ``` 形式で構造化JSONを出力してください。";
      } else if (currentMode === 'markdown') {
        systemInstruction = "見出し(#)、箇条書き(-)、リスト、太字等を使って読みやすいMarkdown形式で出力してください。";
      } else if (currentMode === 'ruby_furigana') {
        systemInstruction = "縦書きやルビ(ふりがな)を正確に文字起こししてください。ふりがなは 漢字(かんじ) の形式で付与してください。";
      } else if (currentMode === 'translate') {
        systemInstruction = "原文の文字起こしを出力した後、区切り線(---)を挟んで日本語訳または英訳を出力してください。";
      }

      const payload = {
        systemInstruction: { parts: [{ text: systemInstruction }] },
        contents: [
          {
            parts: [
              { inlineData: { mimeType: mimeType, data: base64Data } },
              { text: userPrompt }
            ]
          }
        ],
        generationConfig: { temperature: 0.1 }
      };

      // 試行モデルの優先順序
      let candidateModels = [];
      if (selectedModel === 'auto') {
        candidateModels = ['gemini-flash-lite-latest', 'gemini-3.5-flash', 'gemini-3.8-flash'];
      } else {
        // ユーザーが明示選択したモデルを最優先
        candidateModels = [selectedModel];
        if (selectedModel !== 'gemini-flash-lite-latest') candidateModels.push('gemini-flash-lite-latest');
      }

      let lastError = null;
      let succeeded = false;

      for (const model of candidateModels) {
        try {
          if (model === 'gemini-3.8-flash') {
            resultArea.value = `Gemini 3.8 Flash で推論・解析中... (思考プロセス実行中)`;
          } else {
            resultArea.value = `解析中... (モデル: ${model})`;
          }

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

          // gemini-3.8-flash は思考時間を見越して最大45秒、軽量モデルは15秒のタイムアウト
          const timeoutMs = (model === 'gemini-3.8-flash') ? 45000 : 15000;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), timeoutMs);

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timer);

          const data = await response.json();
          if (data.error) {
            const errMsg = data.error.message || '';
            // 混雑(503 / high demand)が発生した場合は次のモデルへ自動フォールバック
            if (data.error.code === 503 || errMsg.includes('high demand') || errMsg.includes('resource exhausted')) {
              console.warn(`Model ${model} is busy (high demand), trying fallback model...`);
              lastError = new Error(errMsg);
              continue;
            }
            throw new Error(`[${model}] ${errMsg} (コード: ${data.error.code})`);
          }

          const candidate = data.candidates?.[0];
          if (!candidate) {
            continue;
          }
          if (candidate.finishReason === 'SAFETY') {
            throw new Error('セーフティフィルターによりブロックされました');
          }

          const parts = candidate.content?.parts || [];
          const text = parts.map(p => p.text).filter(Boolean).join('\n') || '文字が検出されませんでした。';

          resultArea.value = text;
          succeeded = true;
          lastError = null;
          break; // 成功
        } catch (err) {
          console.warn(`Model ${model} failed:`, err.message);
          lastError = err;
        }
      }

      if (!succeeded && lastError) {
        let msg = lastError.message;
        if (msg.includes('high demand')) {
          msg = '選択されたモデル（Googleサーバー）が現在混雑しています。上部のモデル選択で「gemini-flash-lite」を選ぶか、しばらく待ってから再度お試しください。';
        } else if (msg.includes('aborted') || msg.includes('Failed to fetch')) {
          msg = '通信がタイムアウトまたは遮断されました。回線状況をご確認いただくか、超高速モデル「gemini-flash-lite」をお試しください。';
        }
        showNotice('error', '文字起こしエラー', msg);
        resultArea.value = 'エラーが発生しました:\n' + msg;
      }

      runBtn.disabled = false;
      runBtn.textContent = '文字起こしを開始';
    }

    function copyText() {
      navigator.clipboard.writeText(document.getElementById('result').value).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '完了!';
        setTimeout(() => btn.textContent = 'コピー', 1500);
      });
    }

    function downloadText() {
      const text = document.getElementById('result').value;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ocr_result_${Date.now()}.txt`;
      a.click();
    }

    // サンプル書類のロード
    function loadSample(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 700;
      const ctx = canvas.getContext('2d');

      let title = '', mode = 'standard';

      if (type === 'kuzushiji') {
        title = '江戸時代 通行手形 (古文書サンプル)';
        mode = 'kuzushiji';
        ctx.fillStyle = '#f4ebd9';
        ctx.fillRect(0, 0, 600, 700);
        ctx.strokeStyle = '#d7c7af';
        ctx.strokeRect(10, 10, 580, 680);

        ctx.fillStyle = '#1e1c1a';
        ctx.font = 'bold 26px serif';
        ctx.fillText('為取替申手形之事', 180, 80);

        ctx.font = '18px serif';
        ctx.fillText('一、武州葛飾郡本田村百姓 徳次郎', 100, 150);
        ctx.fillText('右者伊勢両宮参宮並金毘羅大権現へ参詣之志立罷出候、', 80, 220);
        ctx.fillText('関所並諸国番所無滞御通し被下度候、相違無御座候', 80, 290);
        ctx.fillText('文政八年 酉三月 名主 伝右衛門 (印)', 140, 420);

        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 3;
        ctx.strokeRect(450, 380, 50, 50);
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('印', 465, 412);
      } else if (type === 'handwriting') {
        title = '手書き会議メモ';
        mode = 'handwriting';
        ctx.fillStyle = '#fffdfa';
        ctx.fillRect(0, 0, 600, 700);
        ctx.strokeStyle = '#e2e8f0';
        for (let y = 80; y < 650; y += 40) {
          ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(560, y); ctx.stroke();
        }
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('10/4 定例MTG 議事メモ', 50, 60);

        ctx.fillStyle = '#334155';
        ctx.font = '18px cursive, sans-serif';
        ctx.fillText('• くずし字・古文書モードの追加検証', 50, 115);
        ctx.fillText('• 手書きホワイトボードの認識率向上', 50, 155);
        ctx.fillText('[x] 翻刻プロンプトの調整完了', 50, 195);
        ctx.fillText('[ ] 10/11 次回MTG準備', 50, 235);
      } else if (type === 'receipt') {
        title = 'コンビニ領収書';
        mode = 'key_value';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 600, 700);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ファミリーマート 渋谷店', 300, 70);
        ctx.font = '14px sans-serif';
        ctx.fillText('2026年10月04日 15:30  レジ01', 300, 105);
        ctx.fillText('----------------------------------------------------', 300, 130);

        ctx.textAlign = 'left';
        ctx.font = '16px monospace';
        ctx.fillText('カフェラテ (L)          ¥280', 100, 180);
        ctx.fillText('鮭おにぎり              ¥340', 100, 220);
        ctx.fillText('----------------------------------------------------', 100, 270);
        ctx.font = 'bold 20px monospace';
        ctx.fillText('合計金額 (税込)         ¥620', 100, 310);
      } else {
        title = 'スペック仕様表';
        mode = 'table';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 600, 700);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('サーバー仕様・性能比較一覧表', 50, 60);

        ctx.strokeStyle = '#94a3b8';
        ctx.strokeRect(50, 100, 500, 240);
        ctx.beginPath();
        ctx.moveTo(50, 150); ctx.lineTo(550, 150);
        ctx.moveTo(50, 200); ctx.lineTo(550, 200);
        ctx.moveTo(50, 250); ctx.lineTo(550, 250);
        ctx.moveTo(220, 100); ctx.lineTo(220, 340);
        ctx.moveTo(380, 100); ctx.lineTo(380, 340);
        ctx.stroke();

        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('項目', 110, 130);
        ctx.fillText('Model A', 270, 130);
        ctx.fillText('Model B', 430, 130);

        ctx.font = '15px sans-serif';
        ctx.fillText('CPUコア数', 80, 180); ctx.fillText('8 Cores', 260, 180); ctx.fillText('16 Cores', 420, 180);
        ctx.fillText('メモリ容量', 80, 230); ctx.fillText('32 GB', 270, 230); ctx.fillText('64 GB', 430, 230);
        ctx.fillText('SSD容量', 80, 280); ctx.fillText('1 TB NVMe', 250, 280); ctx.fillText('2 TB NVMe', 410, 280);
      }

      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      base64Data = (dataUrl.split(',')[1] || '').replace(/[\r\n\s]/g, '');
      mimeType = 'image/jpeg';
      showWorkspace(dataUrl, title, false);
      setMode(mode);
    }
  </script>
